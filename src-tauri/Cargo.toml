[package]
name = "mec-notes"
version = "0.1.1"
description = "Bloco de Notas Rapido para Windows com Tauri v2"
authors = ["devca"]
edition = "2021"

[lib]
name = "mec_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"
rfd = "0.15"
log = "0.4"
env_logger = "0.11"
